name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate structure, skills and house style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Repository validator
        run: python3 scripts/validate_plugin.py
      - name: Run each skill script on its fixture (pr-queue exits 1 because the fixture has planted stuck PRs)
        run: |
          set +e
          python3 scripts/cli.py pr-queue tests/fixtures/pr_queue > /dev/null; test $? -eq 1 || exit 1
          set -e
          python3 scripts/cli.py iteration-report tests/fixtures/iteration --from 2026-09-14 --to 2026-09-25 > /dev/null
          python3 scripts/cli.py postmortem tests/fixtures/postmortem --issue 412 --redact > /dev/null

  tests:
    name: Tests and lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help, run each subcommand's --help and a fixture, and check the user
        run: |
          docker build --build-arg VERSION=ci -t github-manager-skills:ci .
          docker run --rm github-manager-skills:ci --help > help.txt && grep "^usage: github-manager <subcommand>" help.txt
          for s in pr-queue iteration-report postmortem; do docker run --rm github-manager-skills:ci "$s" --help > /dev/null; done
          docker run --rm -v "$PWD/tests/fixtures:/work:ro" github-manager-skills:ci postmortem /work/postmortem --issue 412 --redact > pm.md
          grep "^# Postmortem:" pm.md
          docker run --rm github-manager-skills:ci --version
          test "$(docker run --rm --entrypoint id github-manager-skills:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint pwd github-manager-skills:ci)" = "/work"

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/github-manager
